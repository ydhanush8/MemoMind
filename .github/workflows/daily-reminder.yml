name: Daily Reminder

# Triggers the MemoMind daily practice reminder on the Render backend.
# 01:30 UTC = 07:00 IST nominal. GitHub Actions cron runs ~2h late under load,
# so it lands ~09:00 IST in practice. Adjust if it drifts.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch: {} # allows a manual run from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily-reminders endpoint
        run: |
          curl -fsS -X GET \
            "https://memomind-zqw3.onrender.com/api/cron/daily-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
